<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Comparativo — Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 sm:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
      <div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Comparador de Precios</h1>
        <p class="text-xs text-slate-400 mt-1">Precios netos en USD (Vital vs. Nena vs. Intercontinental)</p>
      </div>
      <a href="ADMIN.html" class="self-start sm:self-auto text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-xl transition flex items-center gap-2">
        ⚙️ Cargar Catálogos
      </a>
    </div>

    <!-- Buscador -->
    <div class="relative">
      <input 
        type="text" 
        id="searchInput" 
        oninput="buscarProductos()" 
        placeholder="Buscar por producto o código de barras (ej: Losartan, Acetaminofen, 759...)..." 
        class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 text-white placeholder-slate-500 text-sm rounded-2xl px-5 py-4 outline-none shadow-lg transition"
        autofocus
      >
      <span id="counter" class="absolute right-4 top-4 text-xs font-semibold text-slate-500"></span>
    </div>

    <!-- Tabla de Resultados -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b border-slate-800 bg-slate-950/50 text-slate-400 uppercase tracking-wider font-bold">
              <th class="p-4">Producto / Código EAN</th>
              <th class="p-4 text-center">Vital Clinic</th>
              <th class="p-4 text-center">Droguería Nena</th>
              <th class="p-4 text-center">Intercontinental</th>
              <th class="p-4 text-center">Mejor Precio</th>
            </tr>
          </thead>
          <tbody id="resultsTable" class="divide-y divide-slate-800/60 font-medium">
            <tr>
              <td colspan="5" class="p-8 text-center text-slate-500">Escribe en el buscador para empezar a comparar...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const DB_NAME = "FarmaciaEcuadorDB_V11";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function buscarProductos() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const tbody = document.getElementById('resultsTable');
      const counter = document.getElementById('counter');

      if (!query || query.length < 2) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Escribe al menos 2 caracteres para buscar...</td></tr>';
        counter.innerText = '';
        return;
      }

      const db = await openDB();
      const tx = db.transaction("productos", "readonly");
      const store = tx.objectStore("productos");
      const req = store.getAll();

      req.onsuccess = () => {
        const todos = req.result || [];
        const tokens = query.split(' ').filter(t => t.length > 0);

        // Filtrado por coincidencia de texto en nombre o código de barras
        const filtrados = todos.filter(p => {
          const target = `${p.nombre} ${p.barcode || ''}`.toLowerCase();
          return tokens.every(token => target.includes(token));
        }).slice(0, 50); // Mostrar max 50 resultados para rendimiento

        counter.innerText = `${filtrados.length} resultado(s)`;

        if (filtrados.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">No se encontraron coincidencias.</td></tr>';
          return;
        }

        tbody.innerHTML = filtrados.map(p => {
          const vVal = p.precios.vital || 0;
          const nVal = p.precios.nena || 0;
          const iVal = p.precios.inter || 0;

          // Buscar el precio mínimo disponible (mayor a 0)
          const validos = [vVal, nVal, iVal].filter(v => v > 0);
          const minVal = validos.length > 0 ? Math.min(...validos) : 0;

          return `
            <tr class="hover:bg-slate-800/40 transition">
              <td class="p-4">
                <div class="font-bold text-slate-100">${p.nombre}</div>
                <div class="text-[10px] font-mono text-slate-500 mt-0.5">${p.barcode ? 'EAN: ' + p.barcode : 'Sin Código'}</div>
              </td>
              <td class="p-4 text-center ${vVal > 0 && vVal === minVal ? 'text-emerald-400 font-bold bg-emerald-500/10 rounded-lg' : 'text-slate-300'}">
                ${vVal > 0 ? '$' + vVal.toFixed(2) : '<span class="text-slate-600">-</span>'}
              </td>
              <td class="p-4 text-center ${nVal > 0 && nVal === minVal ? 'text-emerald-400 font-bold bg-emerald-500/10 rounded-lg' : 'text-slate-300'}">
                ${nVal > 0 ? '$' + nVal.toFixed(2) : '<span class="text-slate-600">-</span>'}
              </td>
              <td class="p-4 text-center ${iVal > 0 && iVal === minVal ? 'text-emerald-400 font-bold bg-emerald-500/10 rounded-lg' : 'text-slate-300'}">
                ${iVal > 0 ? '$' + iVal.toFixed(2) : '<span class="text-slate-600">-</span>'}
              </td>
              <td class="p-4 text-center font-extrabold text-emerald-400 bg-slate-950/30">
                ${minVal > 0 ? '$' + minVal.toFixed(2) : '-'}
              </td>
            </tr>
          `;
        }).join('');
      };
    }
  </script>
</body>
</html>
