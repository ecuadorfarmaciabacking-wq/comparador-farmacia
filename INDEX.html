<!DOCTYPE html>
<html lang="es" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Precios - Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div class="max-w-6xl w-full space-y-6">
    
    <!-- Encabezado -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/60 p-6 rounded-3xl border border-slate-800">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 font-extrabold flex items-center justify-center border border-emerald-500/20 text-lg">
          FE
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">Consulta de Precios Unificada</h1>
          <p class="text-xs text-slate-400">Farmacia Ecuador C.A.</p>
        </div>
      </div>
      <a href="ADMIN.html" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-2">
        <span>⚙️ Cargar / Actualizar Archivos</span>
      </a>
    </div>

    <!-- Buscador e Info -->
    <div class="glass p-6 rounded-3xl space-y-4 shadow-xl border border-slate-800">
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <div class="relative w-full">
          <input type="text" id="searchInput" placeholder="Escribe el nombre del medicamento o el código de barras (EAN)..." 
                 class="w-full bg-slate-900/90 border border-slate-700 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          <span class="absolute left-4 top-3.5 text-slate-400 text-base">🔍</span>
        </div>
        <div id="dbStatus" class="text-xs text-slate-400 whitespace-nowrap font-medium px-2">
          Cargando datos...
        </div>
      </div>
    </div>

    <!-- Tabla de Resultados -->
    <div class="glass rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/90 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-800">
            <tr>
              <th class="p-4 pl-6">Producto / Descripción</th>
              <th class="p-4 text-center">Vital Clinic</th>
              <th class="p-4 text-center">Droguería Nena</th>
              <th class="p-4 text-center">Intercontinental</th>
              <th class="p-4 pr-6 text-center">Mejor Opción</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/60 text-slate-300">
            <tr>
              <td colspan="5" class="p-12 text-center text-slate-500 font-medium">
                No hay productos en pantalla. Escribe en el buscador para consultar.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const DB_NAME = "FarmaciaEcuadorDB";
    const DB_VERSION = 4;
    let todosLosProductos = [];

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("productos")) {
            db.createObjectStore("productos", { keyPath: "key" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function cargarBaseDatos() {
      const statusEl = document.getElementById('dbStatus');
      try {
        const db = await openDB();
        const tx = db.transaction("productos", "readonly");
        const store = tx.objectStore("productos");
        const req = store.getAll();

        req.onsuccess = () => {
          todosLosProductos = req.result || [];
          if (todosLosProductos.length > 0) {
            statusEl.innerHTML = `<span class="text-emerald-400 font-bold">${todosLosProductos.length.toLocaleString()}</span> productos unificados`;
          } else {
            statusEl.innerHTML = `<span class="text-rose-400">Base de datos vacía. Ve a Administración.</span>`;
          }
        };
      } catch (err) {
        console.error(err);
        statusEl.innerText = "Error cargando datos.";
      }
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase().trim();
      const tbody = document.getElementById('tableBody');

      if (!query || query.length < 2) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="p-12 text-center text-slate-500 font-medium">
              Escribe al menos 2 letras para iniciar la búsqueda...
            </td>
          </tr>`;
        return;
      }

      const palabras = query.split(' ').filter(p => p.length > 0);

      const resultados = todosLosProductos.filter(p => {
        const nombre = (p.nombre || "").toLowerCase();
        const barcode = (p.barcode || "").toLowerCase();
        return palabras.every(palabra => nombre.includes(palabra) || barcode.includes(palabra));
      }).slice(0, 100);

      if (resultados.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="p-12 text-center text-slate-500 font-medium">
              No se encontraron coincidencias para "${query}".
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = resultados.map(p => {
        const pVital = p.precios && p.precios.vital ? p.precios.vital : null;
        const pNena = p.precios && p.precios.nena ? p.precios.nena : null;
        const pInter = p.precios && p.precios.inter ? p.precios.inter : null;

        const vitalStr = pVital ? `$${pVital.toFixed(2)}` : '-';
        const nenaStr = pNena ? `$${pNena.toFixed(2)}` : '-';
        const interStr = pInter ? `$${pInter.toFixed(2)}` : '-';

        const preciosValidos = [];
        if (pVital) preciosValidos.push({ prov: 'Vital Clinic', val: pVital });
        if (pNena) preciosValidos.push({ prov: 'Droguería Nena', val: pNena });
        if (pInter) preciosValidos.push({ prov: 'Intercontinental', val: pInter });

        preciosValidos.sort((a, b) => a.val - b.val);
        const mejor = preciosValidos[0];

        const vitalClass = (mejor && mejor.prov === 'Vital Clinic') ? 'font-bold text-emerald-400 bg-emerald-500/10 rounded-lg py-1 px-2 inline-block' : 'text-slate-400';
        const nenaClass = (mejor && mejor.prov === 'Droguería Nena') ? 'font-bold text-emerald-400 bg-emerald-500/10 rounded-lg py-1 px-2 inline-block' : 'text-slate-400';
        const interClass = (mejor && mejor.prov === 'Intercontinental') ? 'font-bold text-emerald-400 bg-emerald-500/10 rounded-lg py-1 px-2 inline-block' : 'text-slate-400';

        return `
          <tr class="hover:bg-slate-900/50 transition border-b border-slate-800/40">
            <td class="p-4 pl-6">
              <div class="font-bold text-white text-sm">${p.nombre}</div>
              ${p.barcode ? `<div class="text-[10px] text-slate-500 font-mono mt-0.5">EAN: ${p.barcode}</div>` : ''}
            </td>
            <td class="p-4 text-center font-mono ${vitalClass}">${vitalStr}</td>
            <td class="p-4 text-center font-mono ${nenaClass}">${nenaStr}</td>
            <td class="p-4 text-center font-mono ${interClass}">${interStr}</td>
            <td class="p-4 pr-6 text-center">
              ${mejor ? `
                <div class="inline-flex flex-col items-center">
                  <span class="text-xs font-extrabold text-emerald-400">$${mejor.val.toFixed(2)}</span>
                  <span class="text-[9px] font-semibold text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full mt-1 border border-slate-700">${mejor.prov}</span>
                </div>
              ` : '-'}
            </td>
          </tr>
        `;
      }).join('');
    });

    cargarBaseDatos();
  </script>
</body>
</html>
