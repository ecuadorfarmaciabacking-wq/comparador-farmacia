<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargador de Catálogos — Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería Excel y CSV -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 p-6 flex flex-col justify-center items-center">

  <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-xl font-bold text-white">Cargador Nube Multidroguería USD</h1>
        <p class="text-xs text-slate-400">Sincronización directa con Firebase para consulta en móvil</p>
      </div>
      <a href="INDEX.html" class="text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2.5 rounded-xl hover:bg-emerald-500/20 transition">
        Ir al Buscador →
      </a>
    </div>

    <!-- Controles de Carga -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 text-center space-y-3">
        <h2 class="text-sm font-bold text-emerald-400">1. Vital Clinic</h2>
        <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl block shadow-lg">
          Cargar VITAL.xlsx
          <input type="file" accept=".xlsx, .xls, .csv" class="hidden" onchange="cargarDrogueria(event, 'vital')">
        </label>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 text-center space-y-3">
        <h2 class="text-sm font-bold text-blue-400">2. Droguería Nena</h2>
        <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl block shadow-lg">
          Cargar NENA.xlsx
          <input type="file" accept=".xlsx, .xls, .csv" class="hidden" onchange="cargarDrogueria(event, 'nena')">
        </label>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 text-center space-y-3">
        <h2 class="text-sm font-bold text-purple-400">3. Intercontinental</h2>
        <label class="cursor-pointer bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl block shadow-lg">
          Cargar INTER (.xlsx / .csv)
          <input type="file" accept=".xlsx, .xls, .csv" class="hidden" onchange="cargarDrogueria(event, 'inter')">
        </label>
      </div>
    </div>

    <div id="statusBox" class="hidden p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono text-emerald-400 break-words"></div>

    <div class="flex justify-between items-center pt-2 border-t border-slate-800">
      <button onclick="borrarBD()" class="text-xs font-semibold text-rose-400 hover:underline">
        🗑️ Vaciar Nube Completa
      </button>
      <span id="totalSaved" class="text-xs text-slate-400">Conectando con la nube...</span>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBFIE1B40489wm4QguyRLCTHL5QCmEE7eo",
      authDomain: "farmaciaecuadorcomparador.firebaseapp.com",
      databaseURL: "https://farmaciaecuadorcomparador-default-rtdb.firebaseio.com",
      projectId: "farmaciaecuadorcomparador",
      storageBucket: "farmaciaecuadorcomparador.firebasestorage.app",
      messagingSenderId: "716139216624",
      appId: "1:716139216624:web:b693cf4d7e04ff57fb8c35",
      measurementId: "G-5N6ZXYF6GP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Monitorear conteo en la nube
    db.ref("productos").on("value", (snapshot) => {
      const val = snapshot.val();
      const count = val ? Object.keys(val).length : 0;
      document.getElementById('totalSaved').innerText = `${count.toLocaleString()} productos unificados en la nube.`;
    });

    function parseMonto(val) {
      if (val === null || val === undefined) return 0;
      let str = val.toString().trim().replace(/[$]/g, '');
      if (!str) return 0;
      if (str.includes(',') && str.includes('.')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else if (str.includes(',')) {
        str = str.replace(',', '.');
      }
      let num = parseFloat(str);
      return isNaN(num) ? 0 : parseFloat(num.toFixed(2));
    }

    function cleanBarcode(code) {
      if (!code) return "";
      let str = code.toString().trim();
      if (str.includes('E+') || str.includes('e+')) {
        str = Number(str).toFixed(0);
      }
      return str.replace(/\.0$/, '').replace(/[^0-9]/g, '').replace(/^0+/, '');
    }

    function buildMatchKey(nombre, barcode) {
      const ean = cleanBarcode(barcode);
      if (ean && ean.length >= 6) return "EAN_" + ean;
      if (!nombre) return "";

      const clean = nombre.toString().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/diclofenaco/g, "diclofenac")
        .replace(/acetaminofeno/g, "acetaminofen")
        .replace(/[^a-z0-9]/g, " ");

      const stopWords = ['tab', 'tabletas', 'cap', 'capsulas', 'comp', 'comprimidos', 'sol', 'susp', 'caj', 'fco', 'mg', 'ml', 'g'];
      const tokens = clean.split(' ')
        .filter(t => t.length > 1 && !stopWords.includes(t))
        .sort();

      return tokens.length > 0 ? "NAME_" + tokens.slice(0, 4).join('_') : "";
    }

    async function cargarDrogueria(event, proveedor) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.classList.remove('hidden');
      statusBox.innerText = `Procesando ${file.name} y subiendo a la nube...`;

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

        let hIdx = -1;
        for (let i = 0; i < Math.min(matrix.length, 30); i++) {
          const rowStr = matrix[i].map(x => x.toString().toUpperCase()).join(' ');
          if (rowStr.includes('DESCRIP') || rowStr.includes('PRODUCTO') || rowStr.includes('ARTICULO') || rowStr.includes('NOMBRE')) {
            hIdx = i;
            break;
          }
        }

        if (hIdx === -1) throw new Error("No se detectaron las columnas de encabezado en el archivo.");

        const headers = matrix[hIdx].map(h => h.toString().trim().toUpperCase());

        let idxDesc = headers.findIndex(h => /DESCRIP|PRODUCTO|ARTICULO|NOMBRE/i.test(h));
        let idxBar = headers.findIndex(h => /BARRA|EAN|COD\/BARRAS|CODIGO/i.test(h));
        let idxPrice = -1;

        if (proveedor === 'vital') {
          idxPrice = headers.findIndex(h => h.includes("PRECIO NETO $") || h.includes("PRECIO UNITARIO $"));
        } else if (proveedor === 'nena') {
          idxPrice = headers.findIndex(h => h.includes("EXTERNO ($)") || h.includes("PRECIO EXTERNO"));
        } else if (proveedor === 'inter') {
          // Asignar prioritariamente columna "NETO(USD)" o tomar columna R (índice 17)
          idxPrice = headers.findIndex(h => h.includes("NETO(USD)") || h.includes("NETO (USD)"));
          if (idxPrice === -1) idxPrice = 17; // Columna R (A=0, B=1, ... R=17)
        }

        if (idxPrice === -1) idxPrice = headers.findIndex(h => /USD|\$|NETO|PRECIO/i.test(h));
        if (idxDesc === -1) throw new Error("No se ubicó la columna de descripción del producto.");

        const snapshot = await db.ref("productos").once("value");
        const currentData = snapshot.val() || {};

        let procesados = 0;

        for (let i = hIdx + 1; i < matrix.length; i++) {
          const row = matrix[i];
          if (!row || !row[idxDesc]) continue;

          const rawNombre = row[idxDesc].toString().trim();
          const rawPrecio = row[idxPrice];
          const rawBarra = idxBar !== -1 ? row[idxBar] : "";

          const precioUSD = parseMonto(rawPrecio);
          const key = buildMatchKey(rawNombre, rawBarra);

          if (rawNombre && precioUSD > 0 && key) {
            if (!currentData[key]) {
              currentData[key] = {
                nombre: rawNombre,
                barcode: cleanBarcode(rawBarra),
                precios: {}
              };
            }
            if (!currentData[key].precios) currentData[key].precios = {};
            currentData[key].precios[proveedor] = precioUSD;
            if (!currentData[key].barcode && rawBarra) currentData[key].barcode = cleanBarcode(rawBarra);

            procesados++;
          }
        }

        await db.ref("productos").set(currentData);

        const colNombre = headers[idxPrice] || 'R (NETO USD)';
        statusBox.innerHTML = `✅ <b>${proveedor.toUpperCase()}</b> guardado en la nube.<br>📌 Columna leída: <b>${colNombre}</b>.<br>📊 Total: <b>${procesados}</b> ítems procesados.`;
        event.target.value = "";

      } catch (err) {
        statusBox.innerHTML = `<span class="text-rose-400">❌ Error: ${err.message}</span>`;
      }
    }

    function borrarBD() {
      if (confirm("¿Seguro de vaciar toda la base de datos en la nube?")) {
        db.ref("productos").remove().then(() => {
          alert("Base de datos borrada exitosamente.");
        });
      }
    }
  </script>
</body>
</html>
