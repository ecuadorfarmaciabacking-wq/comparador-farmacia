<!DOCTYPE html>
<html lang="es" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga de Catálogos - Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-6">

  <div class="max-w-2xl w-full glass rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-xl font-bold text-white">Panel de Carga de Inventario</h1>
        <p class="text-xs text-slate-400">Farmacia Ecuador C.A.</p>
      </div>
      <a href="INDEX.html" class="text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2 rounded-xl hover:bg-emerald-500/20 transition">
        Ver Buscador →
      </a>
    </div>

    <!-- Zona de Carga -->
    <div class="border-2 border-dashed border-slate-700 hover:border-emerald-500/50 rounded-2xl p-8 text-center transition cursor-pointer bg-slate-900/40 relative">
      <input type="file" id="fileInput" multiple accept=".xlsx, .xls, .csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
      <div class="space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto text-2xl">📁</div>
        <p class="text-sm font-semibold text-slate-200">Haz clic o arrastra los archivos Excel / CSV aquí</p>
        <p class="text-xs text-slate-500">Admite Vital, Nena e Intercontinental al mismo tiempo</p>
      </div>
    </div>

    <!-- Progreso y Estado -->
    <div id="statusBox" class="hidden p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs space-y-2">
      <div id="statusText" class="font-semibold text-slate-300">Procesando...</div>
      <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Botón Limpiar DB -->
    <div class="flex justify-between items-center pt-2">
      <button onclick="borrarBaseDatos()" class="text-xs font-semibold text-rose-400 hover:text-rose-300 transition">
        🗑️ Vaciar Base de Datos
      </button>
      <span id="totalSaved" class="text-xs text-slate-500">Conectando a base de datos...</span>
    </div>

  </div>

  <script>
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("FarmaciaEcuadorDB", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("productos")) {
            db.createObjectStore("productos", { keyPath: "key" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function cleanBarcode(code) {
      if (!code || code === "N/A" || code === "0") return "";
      let str = code.toString().trim().replace(/\.0$/, '');
      return str.replace(/^0+/, '');
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      statusBox.classList.remove('hidden');

      try {
        const db = await openDB();

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          statusText.innerText = `Leyendo (${i+1}/${files.length}): ${file.name}...`;
          progressBar.style.width = `${((i+0.3)/files.length)*100}%`;

          let keyProveedor = "";
          let lista = [];

          if (file.name.endsWith('.csv')) {
            keyProveedor = "inter";
            const text = await file.text();
            const parsed = Papa.parse(text, { header: true, delimiter: ";" });
            lista = procesarCSVIntercontinental(parsed.data);
          } else {
            const buffer = await file.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });

            const fileName = file.name.toLowerCase();
            if (fileName.includes('vital')) {
              keyProveedor = "vital";
            } else if (fileName.includes('nena') || fileName.includes('dronena')) {
              keyProveedor = "nena";
            } else {
              if (json[0] && (json[0]['PRECIO NETO $'] !== undefined || json[0]['PRECIO UNITARIO $'] !== undefined)) {
                keyProveedor = "vital";
              } else {
                keyProveedor = "nena";
              }
            }

            if (keyProveedor === "vital") lista = procesarVital(json);
            else lista = procesarNena(json);
          }

          statusText.innerText = `Guardando ${lista.length.toLocaleString()} productos de ${file.name}...`;
          progressBar.style.width = `${((i+0.8)/files.length)*100}%`;

          await guardarEnDBBulk(db, keyProveedor, lista);
        }

        progressBar.style.width = `100%`;
        statusText.innerText = "¡Proceso finalizado con éxito! Todos los catálogos se han guardado.";
        actualizarConteo();
      } catch (err) {
        console.error(err);
        statusText.innerText = "❌ Ocurrió un error al procesar. Revisa el formato del archivo.";
      }
    });

    async function guardarEnDBBulk(db, proveedor, productos) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("productos", "readwrite");
        const store = tx.objectStore("productos");

        const getAllReq = store.getAll();
        getAllReq.onsuccess = () => {
          const existetentesMap = new Map();
          getAllReq.result.forEach(item => existetentesMap.set(item.key, item));

          productos.forEach(item => {
            const groupKey = (item.barcode && item.barcode.length >= 6) 
              ? 'BAR_' + item.barcode 
              : 'NAME_' + item.producto.toLowerCase().trim();

            let registro = existetentesMap.get(groupKey);
            if (!registro) {
              registro = { key: groupKey, nombre: item.producto, barcode: item.barcode, precios: {} };
            }
            
            registro.precios[proveedor] = item.precio;
            existetentesMap.set(groupKey, registro);
            store.put(registro);
          });
        };

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function procesarCSVIntercontinental(data) {
      const res = [];
      data.forEach(row => {
        const keys = Object.keys(row);
        const descKey = keys.find(k => k.trim().toUpperCase() === 'DESCRIPCION');
        const priceKey = keys.find(k => k.trim().toUpperCase() === 'NETO(USD)') || keys.find(k => k.trim().toUpperCase() === 'PRECIO(USD)');
        const barKey = keys.find(k => k.trim().toUpperCase() === 'BARRA');

        if (descKey && row[descKey] && priceKey && row[priceKey]) {
          const prod = row[descKey].trim();
          let priceStr = row[priceKey].toString().replace(',', '.').trim();
          let priceNum = parseFloat(priceStr);
          let barcode = barKey ? cleanBarcode(row[barKey]) : "";

          if (prod && priceNum > 0) {
            res.push({ producto: prod, precio: priceNum, barcode: barcode });
          }
        }
      });
      return res;
    }

    function procesarNena(data) {
      const res = [];
      data.forEach(row => {
        const prod = row['DESCRIPCIÓN'] ? row['DESCRIPCIÓN'].toString().trim() : '';
        const priceVal = row['PRECIO EXTERNO ($) REFERENCIAL'];
        const barcode = cleanBarcode(row['CÓD. BARRA']);

        let priceNum = 0;
        if (typeof priceVal === 'number') priceNum = priceVal;
        else if (priceVal) priceNum = parseFloat(priceVal.toString().replace(',', '.'));

        if (prod && priceNum > 0) {
          res.push({ producto: prod, precio: priceNum, barcode: barcode });
        }
      });
      return res;
    }

    function procesarVital(data) {
      const res = [];
      data.forEach(row => {
        const keys = Object.keys(row);
        const descKey = keys.find(k => k.trim().toUpperCase().includes('DESCRIP'));
        const priceKey = keys.find(k => k.trim().toUpperCase().includes('NETO')) || keys.find(k => k.trim().toUpperCase().includes('PRECIO'));
        const barKey = keys.find(k => k.trim().toUpperCase().includes('BARRAS') || k.trim().toUpperCase().includes('EAN') || k.trim().toUpperCase().includes('COD'));

        if (descKey && row[descKey]) {
          const prod = row[descKey].toString().trim();
          const priceVal = priceKey ? row[priceKey] : null;
          const barcode = barKey ? cleanBarcode(row[barKey]) : "";

          let priceNum = 0;
          if (typeof priceVal === 'number') priceNum = priceVal;
          else if (priceVal) priceNum = parseFloat(priceVal.toString().replace(',', '.'));

          if (prod && priceNum > 0) {
            res.push({ producto: prod, precio: priceNum, barcode: barcode });
          }
        }
      });
      return res;
    }

    async function actualizarConteo() {
      try {
        const db = await openDB();
        const tx = db.transaction("productos", "readonly");
        const countReq = tx.objectStore("productos").count();
        countReq.onsuccess = () => {
          document.getElementById('totalSaved').innerText = `${countReq.result.toLocaleString()} productos unificados guardados en base de datos.`;
        };
      } catch(e) {
        document.getElementById('totalSaved').innerText = "0 productos guardados.";
      }
    }

    async function borrarBaseDatos() {
      if (confirm("¿Seguro que deseas vaciar toda la base de datos de precios?")) {
        const db = await openDB();
        const tx = db.transaction("productos", "readwrite");
        tx.objectStore("productos").clear();
        tx.oncomplete = () => {
          alert("Base de datos limpiada.");
          document.getElementById('statusBox').classList.add('hidden');
          actualizarConteo();
        };
      }
    }

    actualizarConteo();
  </script>
</body>
</html>
