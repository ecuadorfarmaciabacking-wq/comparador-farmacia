<!DOCTYPE html>
<html lang="es" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga de Catálogos - Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-6">

  <div class="max-w-4xl w-full glass rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-xl font-bold text-white">Panel de Carga por Droguería</h1>
        <p class="text-xs text-slate-400">Farmacia Ecuador C.A.</p>
      </div>
      <a href="INDEX.html" class="text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2.5 rounded-xl hover:bg-emerald-500/20 transition flex items-center gap-2">
        <span>Ir al Buscador</span> →
      </a>
    </div>

    <!-- Botones de Carga Individuales -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Vital Clinic -->
      <div class="bg-slate-900/60 border border-slate-800 hover:border-emerald-500/40 rounded-2xl p-6 text-center transition flex flex-col justify-between space-y-4">
        <div>
          <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto text-xl font-bold mb-3">V</div>
          <h2 class="text-sm font-bold text-white">Vital Clinic</h2>
          <p class="text-xs text-slate-400 mt-1">Sube Excel (.xlsx / .xls)</p>
        </div>
        <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl transition block shadow-lg shadow-emerald-950/40">
          Cargar Vital
          <input type="file" accept=".xlsx, .xls, .csv" class="hidden" onchange="cargarArchivo(event, 'vital')">
        </label>
      </div>

      <!-- Droguería Nena -->
      <div class="bg-slate-900/60 border border-slate-800 hover:border-blue-500/40 rounded-2xl p-6 text-center transition flex flex-col justify-between space-y-4">
        <div>
          <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center mx-auto text-xl font-bold mb-3">N</div>
          <h2 class="text-sm font-bold text-white">Droguería Nena</h2>
          <p class="text-xs text-slate-400 mt-1">Sube Excel (.xlsx / .xls)</p>
        </div>
        <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl transition block shadow-lg shadow-blue-950/40">
          Cargar Nena
          <input type="file" accept=".xlsx, .xls, .csv" class="hidden" onchange="cargarArchivo(event, 'nena')">
        </label>
      </div>

      <!-- Intercontinental -->
      <div class="bg-slate-900/60 border border-slate-800 hover:border-purple-500/40 rounded-2xl p-6 text-center transition flex flex-col justify-between space-y-4">
        <div>
          <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center mx-auto text-xl font-bold mb-3">I</div>
          <h2 class="text-sm font-bold text-white">Intercontinental</h2>
          <p class="text-xs text-slate-400 mt-1">Sube CSV o Excel</p>
        </div>
        <label class="cursor-pointer bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl transition block shadow-lg shadow-purple-950/40">
          Cargar Intercontinental
          <input type="file" accept=".csv, .xlsx, .xls" class="hidden" onchange="cargarArchivo(event, 'inter')">
        </label>
      </div>

    </div>

    <!-- Progreso y Estado -->
    <div id="statusBox" class="hidden p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs space-y-2">
      <div id="statusText" class="font-semibold text-slate-300 break-words">Procesando...</div>
      <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Pie de página -->
    <div class="flex justify-between items-center pt-2 border-t border-slate-800">
      <button onclick="borrarBaseDatos()" class="text-xs font-semibold text-rose-400 hover:text-rose-300 transition flex items-center gap-1.5">
        <span>🗑️</span> Vaciar Base de Datos
      </button>
      <span id="totalSaved" class="text-xs text-slate-400 font-medium">Conectando a base de datos...</span>
    </div>

  </div>

  <script>
    const DB_NAME = "FarmaciaEcuadorDB";
    const DB_VERSION = 4;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("productos")) {
            db.createObjectStore("productos", { keyPath: "key" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function cleanBarcode(code) {
      if (!code || code === "N/A" || code === "0") return "";
      let str = code.toString().trim().replace(/\.0$/, '');
      return str.replace(/^0+/, '');
    }

    // Normalizador estricto de números / precios en moneda ($ / Bs)
    function parsePrecioNumber(val) {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      
      let str = val.toString().trim();
      // Quitar símbolos de moneda y letras
      str = str.replace(/[^0-9.,]/g, '');
      if (!str) return 0;

      // Detectar formato: 1.250,50 o 1,250.50
      if (str.includes(',') && str.includes('.')) {
        if (str.indexOf('.') < str.indexOf(',')) {
          // Formato europeo/latino: 1.250,50 -> 1250.50
          str = str.replace(/\./g, '').replace(',', '.');
        } else {
          // Formato US: 1,250.50 -> 1250.50
          str = str.replace(/,/g, '');
        }
      } else if (str.includes(',')) {
        // Solo coma: ej "12,50" -> "12.50"
        str = str.replace(',', '.');
      }

      const num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    async function cargarArchivo(event, proveedor) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      statusBox.classList.remove('hidden');

      statusText.innerText = `Leyendo ${file.name}...`;
      progressBar.style.width = `20%`;

      try {
        const db = await openDB();
        let jsonRows = [];

        if (file.name.toLowerCase().endsWith('.csv')) {
          const text = await file.text();
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: false });
          jsonRows = parsed.data;
        } else {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          
          // Extraer como matriz primero para encontrar la fila real de encabezados
          const rawMatrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          jsonRows = convertirMatrizAObjetos(rawMatrix);
        }

        progressBar.style.width = `50%`;
        statusText.innerText = `Analizando precios y productos de ${proveedor.toUpperCase()}...`;

        const lista = procesarFilasGenerico(jsonRows, proveedor);

        if (!lista.length) {
          throw new Error(`No se detectaron columnas de producto/precio válidas en el archivo.`);
        }

        statusText.innerText = `Guardando ${lista.length.toLocaleString()} productos de ${proveedor.toUpperCase()}...`;
        progressBar.style.width = `80%`;

        await guardarEnDBBulk(db, proveedor, lista);

        progressBar.style.width = `100%`;
        statusText.innerHTML = `<span class="text-emerald-400">¡Éxito! Se actualizaron ${lista.length.toLocaleString()} productos para ${proveedor.toUpperCase()}.</span>`;
        actualizarConteo();
        event.target.value = "";
      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span class="text-rose-400">❌ Error: ${err.message || err}</span>`;
      }
    }

    // Busca la fila donde realmente están los encabezados (salta títulos y filas vacías)
    function convertirMatrizAObjetos(matrix) {
      if (!matrix || !matrix.length) return [];
      
      let headerRowIndex = 0;
      for (let i = 0; i < Math.min(matrix.length, 15); i++) {
        const rowStr = matrix[i].join(' ').toUpperCase();
        if (rowStr.includes('DESCRIP') || rowStr.includes('PRODUCTO') || rowStr.includes('ARTICULO') || rowStr.includes('PRECIO') || rowStr.includes('NETO')) {
          headerRowIndex = i;
          break;
        }
      }

      const headers = matrix[headerRowIndex].map(h => h.toString().trim());
      const result = [];

      for (let i = headerRowIndex + 1; i < matrix.length; i++) {
        const row = matrix[i];
        if (!row || row.length === 0) continue;
        let obj = {};
        let hasData = false;
        headers.forEach((h, colIdx) => {
          if (h) {
            obj[h] = row[colIdx] !== undefined ? row[colIdx] : "";
            if (obj[h] !== "") hasData = true;
          }
        });
        if (hasData) result.push(obj);
      }
      return result;
    }

    function procesarFilasGenerico(data, proveedor) {
      const res = [];
      data.forEach(row => {
        const keys = Object.keys(row);
        
        // Buscar columna de descripción
        const descKey = keys.find(k => {
          const K = k.trim().toUpperCase();
          return K.includes('DESCRIP') || K.includes('PRODUCTO') || K.includes('ARTICULO') || K.includes('NOMBRE');
        });

        // Buscar columna de precio
        const priceKey = keys.find(k => {
          const K = k.trim().toUpperCase();
          if (proveedor === 'inter') return K.includes('NETO') || K.includes('PRECIO') || K.includes('USD');
          if (proveedor === 'vital') return K.includes('NETO') || K.includes('PRECIO') || K.includes('P.V.P') || K.includes('VENTA');
          return K.includes('PRECIO') || K.includes('EXTERNO') || K.includes('NETO') || K.includes('DIVISA') || K.includes('USD');
        });

        // Buscar código de barras
        const barKey = keys.find(k => {
          const K = k.trim().toUpperCase();
          return K.includes('BARRA') || K.includes('EAN') || K.includes('CODIGO') || K.includes('CÓD');
        });

        if (descKey && row[descKey]) {
          const prod = row[descKey].toString().trim();
          const rawPrice = priceKey ? row[priceKey] : null;
          const barcode = barKey ? cleanBarcode(row[barKey]) : "";

          const priceNum = parsePrecioNumber(rawPrice);

          if (prod && priceNum > 0) {
            res.push({ producto: prod, precio: priceNum, barcode: barcode });
          }
        }
      });
      return res;
    }

    async function guardarEnDBBulk(db, proveedor, productos) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("productos", "readwrite");
        const store = tx.objectStore("productos");

        const getAllReq = store.getAll();
        getAllReq.onsuccess = () => {
          const existetentesMap = new Map();
          (getAllReq.result || []).forEach(item => {
            if (item && item.key) existetentesMap.set(item.key, item);
          });

          productos.forEach(item => {
            if (!item || !item.producto) return;

            let groupKey = "";
            if (item.barcode && item.barcode.length >= 6) {
              groupKey = 'BAR_' + item.barcode;
            } else {
              const cleanName = item.producto.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
              if (cleanName) groupKey = 'NAME_' + cleanName;
            }

            if (!groupKey) return;

            let registro = existetentesMap.get(groupKey);
            if (!registro) {
              registro = { key: groupKey, nombre: item.producto, barcode: item.barcode || "", precios: {} };
            }
            
            registro.precios[proveedor] = item.precio;
            if (item.barcode && !registro.barcode) registro.barcode = item.barcode;

            existetentesMap.set(groupKey, registro);
            store.put(registro);
          });
        };

        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function actualizarConteo() {
      try {
        const db = await openDB();
        const tx = db.transaction("productos", "readonly");
        const countReq = tx.objectStore("productos").count();
        countReq.onsuccess = () => {
          document.getElementById('totalSaved').innerText = `${countReq.result.toLocaleString()} productos unificados guardados en base de datos.`;
        };
      } catch(e) {
        document.getElementById('totalSaved').innerText = "0 productos guardados.";
      }
    }

    async function borrarBaseDatos() {
      if (confirm("¿Seguro que deseas vaciar toda la base de datos de precios?")) {
        const db = await openDB();
        const tx = db.transaction("productos", "readwrite");
        tx.objectStore("productos").clear();
        tx.oncomplete = () => {
          alert("Base de datos limpiada.");
          document.getElementById('statusBox').classList.add('hidden');
          actualizarConteo();
        };
      }
    }

    actualizarConteo();
  </script>
</body>
</html>
