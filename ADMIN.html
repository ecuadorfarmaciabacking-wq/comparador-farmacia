<!DOCTYPE html>
<html lang="es" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga de Catálogos - Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-6">

  <div class="max-w-2xl w-full glass rounded-3xl p-8 shadow-2xl space-y-6 border border-slate-800">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-xl font-bold text-white">Panel de Administración</h1>
        <p class="text-xs text-slate-400">Carga de listas de droguerías (Farmacia Ecuador)</p>
      </div>
      <a href="index.html" class="text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2 rounded-xl hover:bg-emerald-500/20 transition">
        Ver Comparador →
      </a>
    </div>

    <!-- Zona de Carga -->
    <div class="border-2 border-dashed border-slate-700 hover:border-emerald-500/50 rounded-2xl p-8 text-center transition cursor-pointer bg-slate-900/40 relative">
      <input type="file" id="fileInput" multiple accept=".xlsx, .xls, .csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
      <div class="space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto text-2xl">📁</div>
        <p class="text-sm font-semibold text-slate-200">Haz clic o arrastra los archivos Excel / CSV aquí</p>
        <p class="text-xs text-slate-500">Puedes subir Vital, Nena e Intercontinental al mismo tiempo</p>
      </div>
    </div>

    <!-- Progreso -->
    <div id="statusBox" class="hidden p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs space-y-2">
      <div id="statusText" class="font-semibold text-slate-300">Procesando...</div>
      <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Botón Limpiar DB -->
    <div class="flex justify-between items-center pt-2">
      <button onclick="borrarBaseDatos()" class="text-xs font-semibold text-rose-400 hover:text-rose-300 transition">
        🗑️ Vaciar Base de Datos
      </button>
      <span id="totalSaved" class="text-xs text-slate-500">Comprobando datos guardados...</span>
    </div>

  </div>

  <script>
    // Configuración IndexedDB
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("FarmaciaEcuadorDB", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("productos")) {
            db.createObjectStore("productos", { keyPath: "key" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function cleanBarcode(code) {
      if (!code || code === "N/A" || code === "0") return "";
      let str = code.toString().trim().replace(/\.0$/, '');
      return str.replace(/^0+/, '');
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      statusBox.classList.remove('hidden');

      const db = await openDB();

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusText.innerText = `Procesando (${i+1}/${files.length}): ${file.name}`;
        progressBar.style.width = `${((i+1)/files.length)*100}%`;

        let keyProveedor = "";
        let lista = [];

        if (file.name.endsWith('.csv')) {
          keyProveedor = "inter";
          const text = await file.text();
          const parsed = Papa.parse(text, { header: true, delimiter: ";" });
          lista = procesarCSVIntercontinental(parsed.data);
        } else {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });

          const fileName = file.name.toLowerCase();
          if (fileName.includes('vital') || (json[0] && json[0]['PRECIO NETO $'])) keyProveedor = "vital";
          else keyProveedor = "nena";

          if (keyProveedor === "vital") lista = procesarVital(json);
          else lista = procesarNena(json);
        }

        await guardarEnDB(db, keyProveedor, lista);
      }

      statusText.innerText = "¡Carga completada con éxito!";
      actualizarConteo();
    });

    async function guardarEnDB(db, proveedor, productos) {
      const tx = db.transaction("productos", "readwrite");
      const store = tx.objectStore("productos");

      for (const item of productos) {
        const groupKey = (item.barcode && item.barcode.length >= 6) ? 'BAR_' + item.barcode : 'NAME_' + item.producto.toLowerCase().trim();
        
        let registro = await new Promise(res => {
          const req = store.get(groupKey);
          req.onsuccess = () => res(req.result);
        });

        if (!registro) {
          registro = { key: groupKey, nombre: item.producto, barcode: item.barcode, precios: {} };
        }
        
        registro.precios[proveedor] = item.precio;
        store.put(registro);
      }
      return tx.complete;
    }

    function procesarCSVIntercontinental(data) {
      return data.filter(r => r['DESCRIPCION'] && r['NETO(USD)']).map(r => ({
        producto: r['DESCRIPCION'].trim(),
        precio: parseFloat(r['NETO(USD)'].toString().replace(',', '.')),
        barcode: cleanBarcode(r['BARRA'])
      })).filter(x => x.precio > 0);
    }

    function procesarNena(data) {
      return data.filter(r => r['DESCRIPCIÓN'] && r['PRECIO EXTERNO ($) REFERENCIAL']).map(r => ({
        producto: r['DESCRIPCIÓN'].trim(),
        precio: parseFloat(r['PRECIO EXTERNO ($) REFERENCIAL'].toString().replace(',', '.')),
        barcode: cleanBarcode(r['CÓD. BARRA'])
      })).filter(x => x.precio > 0);
    }

    function procesarVital(data) {
      return data.filter(r => r['DESCRIPCION'] && r['PRECIO NETO $']).map(r => ({
        producto: r['DESCRIPCION'].trim(),
        precio: parseFloat(r['PRECIO NETO $'].toString().replace(',', '.')),
        barcode: cleanBarcode(r['COD BARRAS'])
      })).filter(x => x.precio > 0);
    }

    async function actualizarConteo() {
      const db = await openDB();
      const tx = db.transaction("productos", "readonly");
      const countReq = tx.objectStore("productos").count();
      countReq.onsuccess = () => {
        document.getElementById('totalSaved').innerText = `${countReq.result.toLocaleString()} productos unificados guardados.`;
      };
    }

    async function borrarBaseDatos() {
      if (confirm("¿Seguro que deseas vaciar toda la base de datos de precios?")) {
        const db = await openDB();
        const tx = db.transaction("productos", "readwrite");
        tx.objectStore("productos").clear();
        tx.oncomplete = () => {
          alert("Base de datos limpiada.");
          actualizarConteo();
        };
      }
    }

    actualizarConteo();
  </script>
</body>
</html>
