<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargador de Catálogos — Farmacia Ecuador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 p-6 flex flex-col justify-center items-center">

  <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-xl font-bold text-white">Unificador Multidroguería USD v11</h1>
        <p class="text-xs text-slate-400">Lectura exacta en dólares para Vital, Nena e Intercontinental (Insuaminca)</p>
      </div>
      <a href="INDEX.html" class="text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2.5 rounded-xl hover:bg-emerald-500/20 transition">
        Ir al Buscador →
      </a>
    </div>

    <!-- Controles de Carga -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 text-center space-y-3">
        <h2 class="text-sm font-bold text-emerald-400">1. Vital Clinic</h2>
        <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl block shadow-lg">
          Cargar VITAL16-9-.xlsx
          <input type="file" accept=".xlsx, .xls" class="hidden" onchange="cargarDrogueria(event, 'vital')">
        </label>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 text-center space-y-3">
        <h2 class="text-sm font-bold text-blue-400">2. Droguería Nena</h2>
        <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl block shadow-lg">
          Cargar NENA16-9-.xlsx
          <input type="file" accept=".xlsx, .xls" class="hidden" onchange="cargarDrogueria(event, 'nena')">
        </label>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 text-center space-y-3">
        <h2 class="text-sm font-bold text-purple-400">3. Intercontinental</h2>
        <label class="cursor-pointer bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs py-2.5 px-4 rounded-xl block shadow-lg">
          Cargar INSUAMINCA.xlsx
          <input type="file" accept=".xlsx, .xls" class="hidden" onchange="cargarDrogueria(event, 'inter')">
        </label>
      </div>
    </div>

    <div id="statusBox" class="hidden p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono text-emerald-400 break-words"></div>

    <div class="flex justify-between items-center pt-2 border-t border-slate-800">
      <button onclick="borrarBD()" class="text-xs font-semibold text-rose-400 hover:underline">
        🗑️ Vaciar Base de Datos Completa
      </button>
      <span id="totalSaved" class="text-xs text-slate-400">Consultando base de datos...</span>
    </div>

  </div>

  <script>
    const DB_NAME = "FarmaciaEcuadorDB_V11";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("productos")) {
            db.createObjectStore("productos", { keyPath: "key" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function parseMonto(val) {
      if (val === null || val === undefined) return 0;
      let str = val.toString().trim().replace(/[$]/g, '');
      if (!str) return 0;
      if (str.includes(',') && str.includes('.')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else if (str.includes(',')) {
        str = str.replace(',', '.');
      }
      let num = parseFloat(str);
      return isNaN(num) ? 0 : parseFloat(num.toFixed(2));
    }

    function cleanBarcode(code) {
      if (!code) return "";
      let str = code.toString().trim();
      if (str.includes('E+') || str.includes('e+')) {
        str = Number(str).toFixed(0);
      }
      return str.replace(/\.0$/, '').replace(/[^0-9]/g, '').replace(/^0+/, '');
    }

    function buildMatchKey(nombre, barcode) {
      const ean = cleanBarcode(barcode);
      if (ean && ean.length >= 6) {
        return "EAN_" + ean;
      }
      if (!nombre) return "";

      const clean = nombre.toString().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/diclofenaco/g, "diclofenac")
        .replace(/acetaminofeno/g, "acetaminofen")
        .replace(/[^a-z0-9]/g, " ");

      const stopWords = ['tab', 'tabletas', 'cap', 'capsulas', 'comp', 'comprimidos', 'sol', 'susp', 'caj', 'fco', 'mg', 'ml', 'g'];
      const tokens = clean.split(' ')
        .filter(t => t.length > 1 && !stopWords.includes(t))
        .sort();

      return tokens.length > 0 ? "NAME_" + tokens.slice(0, 4).join('_') : "";
    }

    async function cargarDrogueria(event, proveedor) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.classList.remove('hidden');
      statusBox.innerText = `Leyendo ${file.name}...`;

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

        if (!matrix.length) throw new Error("El archivo está vacío.");

        // Buscar la fila de encabezados automáticamente
        let hIdx = -1;
        for (let i = 0; i < Math.min(matrix.length, 30); i++) {
          const rowStr = matrix[i].map(x => x.toString().toUpperCase()).join(' ');
          if (rowStr.includes('DESCRIP') || rowStr.includes('PRODUCTO') || rowStr.includes('ARTICULO')) {
            hIdx = i;
            break;
          }
        }

        if (hIdx === -1) throw new Error("No se detectaron las columnas de productos.");

        const headers = matrix[hIdx].map(h => h.toString().trim().toUpperCase());

        // Detección estricta de columnas según el proveedor
        let idxDesc = headers.findIndex(h => /DESCRIP/i.test(h));
        let idxBar = headers.findIndex(h => /BARRA|EAN|COD\/BARRAS/i.test(h));
        let idxPrice = -1;

        if (proveedor === 'vital') {
          idxPrice = headers.findIndex(h => h.includes("PRECIO NETO $"));
          if (idxPrice === -1) idxPrice = headers.findIndex(h => h.includes("PRECIO UNITARIO $"));
        } else if (proveedor === 'nena') {
          idxPrice = headers.findIndex(h => h.includes("EXTERNO ($)") || h.includes("PRECIO EXTERNO"));
        } else if (proveedor === 'inter') {
          idxPrice = headers.findIndex(h => h === "PRECIO F" || h === "PRECIO_F");
          if (idxPrice === -1) idxPrice = headers.findIndex(h => h === "PRECIO");
        }

        if (idxPrice === -1) {
          idxPrice = headers.findIndex(h => /USD|\$|NETO|PRECIO/i.test(h));
        }

        if (idxDesc === -1 || idxPrice === -1) {
          throw new Error("No se pudo identificar la columna de precio en dólares.");
        }

        const db = await openDB();
        const tx = db.transaction("productos", "readwrite");
        const store = tx.objectStore("productos");

        const getAllReq = store.getAll();
        getAllReq.onsuccess = () => {
          const dict = new Map();
          (getAllReq.result || []).forEach(item => dict.set(item.key, item));

          let procesados = 0;

          for (let i = hIdx + 1; i < matrix.length; i++) {
            const row = matrix[i];
            if (!row || !row[idxDesc]) continue;

            const rawNombre = row[idxDesc].toString().trim();
            const rawPrecio = row[idxPrice];
            const rawBarra = idxBar !== -1 ? row[idxBar] : "";

            const precioUSD = parseMonto(rawPrecio);
            const key = buildMatchKey(rawNombre, rawBarra);

            if (rawNombre && precioUSD > 0 && key) {
              let reg = dict.get(key);
              if (!reg) {
                reg = {
                  key: key,
                  nombre: rawNombre,
                  barcode: cleanBarcode(rawBarra),
                  precios: {}
                };
              }

              reg.precios[proveedor] = precioUSD;
              if (!reg.barcode && rawBarra) reg.barcode = cleanBarcode(rawBarra);

              dict.set(key, reg);
              store.put(reg);
              procesados++;
            }
          }

          statusBox.innerHTML = `✅ <b>${proveedor.toUpperCase()}</b> cargado exitosamente. Se guardaron <b>${procesados}</b> productos con precios netos en USD.`;
          actualizarConteo();
          event.target.value = "";
        };

      } catch (err) {
        statusBox.innerHTML = `<span class="text-rose-400">❌ Error al procesar: ${err.message}</span>`;
      }
    }

    async function actualizarConteo() {
      const db = await openDB();
      const tx = db.transaction("productos", "readonly");
      const req = tx.objectStore("productos").count();
      req.onsuccess = () => {
        document.getElementById('totalSaved').innerText = `${req.result.toLocaleString()} productos unificados listos para comparar.`;
      };
    }

    async function borrarBD() {
      if (confirm("¿Vaciar base de datos completa?")) {
        const db = await openDB();
        const tx = db.transaction("productos", "readwrite");
        tx.objectStore("productos").clear();
        tx.oncomplete = () => {
          alert("Base de datos limpia.");
          actualizarConteo();
        };
      }
    }

    actualizarConteo();
  </script>
</body>
</html>
